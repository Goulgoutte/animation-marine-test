name: Collecte

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: collector/pnpm-lock.yaml

      - name: Installer les dépendances
        working-directory: collector
        run: pnpm install --frozen-lockfile

      - name: Installer Chromium (Playwright)
        working-directory: collector
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        working-directory: collector
        run: pnpm test

      - name: Collecte
        working-directory: collector
        run: pnpm collect

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "veille-animation[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte du $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
